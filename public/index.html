<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>User Registration Form</title>
 <style>
   * {
     margin: 0;
     padding: 0;
     box-sizing: border-box;
   }
  
   body {
     font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
     background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
     min-height: 100vh;
     display: flex;
     align-items: center;
     justify-content: center;
     padding: 20px;
   }
  
   .container {
     max-width: 900px;
     width: 100%;
     display: grid;
     grid-template-columns: 1fr 1fr;
     gap: 30px;
     align-items: start;
   }
  
   .form-section, .results-section {
     background: white;
     padding: 30px;
     border-radius: 10px;
     box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
   }
  
   h1 {
     color: #333;
     margin-bottom: 25px;
     font-size: 24px;
   }
  
   .form-group {
     margin-bottom: 20px;
   }
  
   label {
     display: block;
     margin-bottom: 8px;
     color: #555;
     font-weight: 600;
   }
  
   input, select {
     width: 100%;
     padding: 12px;
     border: 2px solid #e0e0e0;
     border-radius: 5px;
     font-size: 14px;
     transition: border-color 0.3s;
   }
  
   input:focus, select:focus {
     outline: none;
     border-color: #667eea;
   }
  
   button {
     width: 100%;
     padding: 12px;
     background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
     color: white;
     border: none;
     border-radius: 5px;
     font-size: 16px;
     font-weight: 600;
     cursor: pointer;
     transition: transform 0.2s;
   }
  
   button:hover {
     transform: translateY(-2px);
   }
  
   .user-card {
     background: #f5f5f5;
     padding: 15px;
     margin-bottom: 15px;
     border-radius: 5px;
     border-left: 4px solid #667eea;
   }
  
   .user-card p {
     margin: 5px 0;
     color: #555;
   }
  
   .user-card strong {
     color: #333;
   }
  
   .search-box {
     margin-bottom: 20px;
   }
  
   .search-box input {
     padding: 10px;
     margin-bottom: 10px;
   }
  
   .success {
     color: #4caf50;
     background: #e8f5e9;
     padding: 10px;
     border-radius: 5px;
     margin-bottom: 15px;
   }
  
   .error {
     color: #f44336;
     background: #ffebee;
     padding: 10px;
     border-radius: 5px;
     margin-bottom: 15px;
   }
  
   @media (max-width: 768px) {
     .container {
       grid-template-columns: 1fr;
     }
   }
 </style>
</head>
<body>
 <div class="container">
   <div class="form-section">
     <h1>📝 User Registration</h1>
     <form id="userForm">
       <div class="form-group">
         <label for="name">Name:</label>
         <input type="text" id="name" name="name" required placeholder="Enter your name">
       </div>
      
       <div class="form-group">
         <label for="city">City:</label>
         <input type="text" id="city" name="city" required placeholder="Enter your city">
       </div>
      
       <div class="form-group">
         <label for="degree">Degree:</label>
         <select id="degree" name="degree" required>
           <option value="">Select Degree</option>
           <option value="Bachelor's">Bachelor's</option>
           <option value="Master's">Master's</option>
           <option value="PhD">PhD</option>
           <option value="Diploma">Diploma</option>
         </select>
       </div>
      
       <button type="submit">✅ Submit</button>
     </form>
     <div id="message"></div>
   </div>
  
   <div class="results-section">
     <h1>📊 Users List</h1>
     <div class="search-box">
       <input type="text" id="searchInput" placeholder="🔍 Search users...">
     </div>
     <div id="usersList"></div>
   </div>
 </div>


 <script>
   const API_URL = '/api';


   // Submit form
   document.getElementById('userForm').addEventListener('submit', async (e) => {
     e.preventDefault();
    
     const name = document.getElementById('name').value;
     const city = document.getElementById('city').value;
     const degree = document.getElementById('degree').value;
     const messageDiv = document.getElementById('message');


     try {
       const response = await fetch(`${API_URL}/users`, {
         method: 'POST',
         headers: { 'Content-Type': 'application/json' },
         body: JSON.stringify({ name, city, degree })
       });


       const data = await response.json();
      
       if (response.ok) {
         messageDiv.innerHTML = '<div class="success">✅ User added successfully!</div>';
         document.getElementById('userForm').reset();
         loadUsers();
         setTimeout(() => messageDiv.innerHTML = '', 3000);
       } else {
         messageDiv.innerHTML = `<div class="error">❌ Error: ${data.error}</div>`;
       }
     } catch (error) {
       messageDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
     }
   });


   // Load all users
   async function loadUsers() {
     try {
       const response = await fetch(`${API_URL}/users`);
       const users = await response.json();
       displayUsers(users);
     } catch (error) {
       console.error('Error loading users:', error);
     }
   }


   // Display users
   function displayUsers(users) {
     const usersList = document.getElementById('usersList');
     if (users.length === 0) {
       usersList.innerHTML = '<p style="color: #999; text-align: center;">No users yet</p>';
       return;
     }
    
     usersList.innerHTML = users.map(user => `
       <div class="user-card">
         <p><strong>Name:</strong> ${user.name}</p>
         <p><strong>City:</strong> ${user.city}</p>
         <p><strong>Degree:</strong> ${user.degree}</p>
       </div>
     `).join('');
   }


   // Search functionality
   document.getElementById('searchInput').addEventListener('input', async (e) => {
     const query = e.target.value.trim();
    
     if (!query) {
       loadUsers();
       return;
     }


     try {
       const response = await fetch(`${API_URL}/search?q=${encodeURIComponent(query)}`);
       const results = await response.json();
       displayUsers(results);
     } catch (error) {
       console.error('Search error:', error);
     }
   });


   // Load users on page load
   loadUsers();
 </script>
</body>
</html>
